apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-worker
  template:
    metadata:
      labels:
        app: review-worker
    spec:
      containers:
        - name: review-worker
          image: codereviewx-review-worker:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: codereviewx-config
            - secretRef:
                name: codereviewx-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
