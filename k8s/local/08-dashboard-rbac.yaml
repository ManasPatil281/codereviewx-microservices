apiVersion: v1
kind: ServiceAccount
metadata:
  name: codereviewx-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codereviewx-dashboard
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codereviewx-dashboard
subjects:
  - kind: ServiceAccount
    name: codereviewx-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codereviewx-dashboard
