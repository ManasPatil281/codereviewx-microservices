apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app: review-worker }
  template:
    metadata:
      labels: { app: review-worker }
    spec:
      containers:
        - name: review-worker
          image: YOUR_REGISTRY/codereviewx-review-worker:latest
          envFrom:
            - configMapRef: { name: codereviewx-config }
            - secretRef: { name: codereviewx-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
