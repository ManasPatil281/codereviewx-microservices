apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: github-service }
  template:
    metadata:
      labels: { app: github-service }
    spec:
      containers:
        - name: github-service
          image: YOUR_REGISTRY/codereviewx-github-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: codereviewx-config }
            - secretRef: { name: codereviewx-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: github-service
spec:
  selector: { app: github-service }
  ports: [{ port: 8081, targetPort: 8081 }]
  type: ClusterIP
